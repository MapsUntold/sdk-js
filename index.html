<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MapsUntold SDK Demo</title>
</head>
<body>
    <h1>MapsUntold SDK Demo</h1>
    <button id="loadChannel">Load Channel</button>
    <div id="channel-info"></div>

    <script type="module">
        import { MapsUntold } from "./dist/bundle.js"; // Verwijs naar de Rollup-output

        const sdk = new MapsUntold({ apiKey: "YOUR_API_KEY" });

        document.getElementById("loadChannel").addEventListener("click", async () => {
            try {
                const channel = await sdk.getChannel("dille-kamille-eindhoven");
                document.getElementById("channel-info").innerHTML = `
                    <h2>Channel Info</h2>
                    <p>ID: ${channel.id}</p>
                    <p>Name: ${channel.name}</p>
                    <p>Location: ${channel.location.lat}, ${channel.location.lng}</p>
                `;
            } catch (error) {
                document.getElementById("channel-info").innerHTML = `<p>Error loading channel: ${error.message}</p>`;
            }
        });
    </script>
</body>
</html>
